services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nexusdeploy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nexusdeploy
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENV=development
      - VERSION=local-dev
      - SECRET_KEY=dev-secret-key-DO-NOT-USE-IN-PROD-32b
      - JWT_SECRET_KEY=dev-secret-key-DO-NOT-USE-IN-PROD-32b
      - AWS_REGION=us-east-1
      - S3_BUCKET=nexusdeploy-attachments-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # No curl in the distroless runtime image — see
      # docs/design-decisions.md#distroless-runtime-images.
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./app:/app  # For development hot-reload

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nexusdeploy
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENV=development
      - SECRET_KEY=dev-secret-key-DO-NOT-USE-IN-PROD-32b
      - JWT_SECRET_KEY=dev-secret-key-DO-NOT-USE-IN-PROD-32b
      - AWS_REGION=us-east-1
      - S3_BUCKET=nexusdeploy-attachments-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app

  beat:
    build:
      context: ./app
      dockerfile: Dockerfile.worker
    # /entrypoint_worker.py first, not a bare celery command — the image's
    # ENTRYPOINT is the distroless base's own python3, so this whole line is
    # arguments to it. See docs/design-decisions.md#distroless-runtime-images.
    command: /entrypoint_worker.py celery -A src.celery_worker:celery beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nexusdeploy
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENV=development
      - SECRET_KEY=dev-secret-key-DO-NOT-USE-IN-PROD-32b
      - JWT_SECRET_KEY=dev-secret-key-DO-NOT-USE-IN-PROD-32b
    depends_on:
      redis:
        condition: service_healthy 

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  postgres_data: