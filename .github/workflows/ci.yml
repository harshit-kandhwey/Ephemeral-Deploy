name: CI - Test & Build

on:
  push:
    branches: [main, dev, staging, "feature/**"]
  pull_request:
    branches: [main, dev, staging]
  workflow_dispatch: # allow manual trigger
    inputs:
      deploy:
        description: "Also dispatch a deploy after CI passes (manual runs only; off = CI without deploy)"
        type: boolean
        default: false
      drain_minutes:
        description: "Only used if 'deploy' is checked. Override the old-slot drain wait, in minutes (blank = environment default: staging 60, prod 1440)."
        required: false
        default: ""

# One run per ref; a newer push cancels the in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Read-only by default; jobs needing more declare it themselves:
#   terraform-lint : contents: write (push terraform fmt commits)
#   ci-summary : actions: write (dispatch deploy.yml)
# See docs/design-decisions.md#least-privilege-workflow-permissions
permissions:
  contents: read

jobs:
  # Gates terraform-lint on infra changes. The workload lives in
  # Nexusdeploy-App, which runs its own lint/test/image-build CI; this repo
  # only deploys it (see docs/design-decisions.md#app-repo-split).
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      infra_changed: ${{ steps.filter.outputs.infra }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the diff range below can reach many commits back.
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          # Manual dispatch runs every check; path filters apply to push and
          # pull_request only.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "infra=true" >> $GITHUB_OUTPUT
            echo "🖐️ Manual dispatch — running all checks regardless of changed paths"
            exit 0
          fi

          # Diff the whole trigger range, not just the last commit:
          #   push         → event.before..HEAD, every commit in the push
          #   new branch   → event.before is all zeros, so use HEAD~1
          #   pull_request → HEAD is the merge commit, so HEAD~1 is the base tip
          # On diff failure, treat everything as changed and run more jobs.
          BASE="HEAD~1"
          if [[ "${{ github.event_name }}" == "push" && \
                "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE="${{ github.event.before }}"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || printf 'terraform/\n')

          if echo "$CHANGED" | grep -qE "^terraform/|^\.github/"; then
            echo "infra=true"  >> $GITHUB_OUTPUT
            echo "🏗️  Infra/workflow changed"
          else
            echo "infra=false" >> $GITHUB_OUTPUT
            echo "⏭️  No infra changes"
          fi

  # Always runs, no path gating — a single workflow-file edit is exactly what
  # this needs to catch, independent of what else changed.
  # See docs/design-decisions.md#github-vars-containing-quotes-must-cross-github_output-via-env-not-raw-
  workflow-lint:
    name: Workflow Quoting Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for GH-expression-into-echo-string quoting risk
        run: |
          # vars./secrets./job-output values can contain arbitrary content
          # (including quotes, e.g. a JSON-array-shaped var) — interpolating
          # them directly inside an `echo "..."` string corrupts the value if
          # it contains a `"`, because GitHub interpolates a GH expression as
          # literal text BEFORE bash parses the line. workflow_dispatch choice
          # inputs (github.event.inputs.X) are exempt: their value space is a
          # fixed enum, so this class of corruption cannot occur.
          PATTERN='echo[^\n]*"[^"]*\$\{\{[[:space:]]*(vars\.|secrets\.|needs\.[A-Za-z0-9_-]+\.outputs\.)'
          if grep -rnE "$PATTERN" .github/workflows/ --include='*.yml' --include='*.yaml'; then
            echo "::error::Found a GH expression (vars.*/secrets.*/needs.*.outputs.*) interpolated directly inside an echo string. This corrupts the value if it ever contains a double-quote. Pass it through env: instead and reference it as \$VAR inside the string. See docs/design-decisions.md#github-vars-containing-quotes-must-cross-github_output-via-env-not-raw- for the exact bug this caught."
            exit 1
          fi
          echo "✅ No risky GH-expression-into-echo-string patterns found"

  # Scans full commit history for hardcoded secrets. Deliberately blocking,
  # unlike the soft-fail CVE/IaC scanners below — see
  # docs/design-decisions.md#secret-scanning-is-the-one-blocking-scanner.
  secrets-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history — gitleaks scans commits, not just the working tree

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose

  # Formats, lints and validates the terraform tree. Parallel with the app jobs.
  terraform-lint:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    # Only run when terraform or workflow files changed
    if: needs.detect-changes.outputs.infra_changed == 'true'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.7.0

      - name: Auto-format Terraform files
        run: terraform fmt -recursive terraform/

      - name: Commit Terraform formatting changes (if any)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          if ! git diff --quiet; then
            git add -A
            git commit -m "style: apply terraform fmt formatting [skip ci]"
            git push
            echo "✅ Terraform formatting fixes committed and pushed"
          else
            echo "✅ No Terraform formatting changes needed"
          fi

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6

      - name: Run TFLint
        run: |
          cd terraform
          tflint --init
          tflint --recursive
        continue-on-error: true

      # Static security scanner for IaC. Non-blocking.
      # See docs/design-decisions.md#non-blocking-security-scanners
      - name: Run Checkov (IaC security scan)
        continue-on-error: true
        run: |
          pip install --quiet checkov
          checkov \
            --directory terraform/ \
            --quiet \
            --compact \
            --soft-fail \
            --output cli \
            --skip-check CKV_AWS_79,CKV2_AWS_5
          # CKV_AWS_79   IMDSv1 — the monitoring user_data already uses IMDSv2.
          # CKV2_AWS_5   "SG is unattached" — false positive; the SGs are wired
          #              in via variables from the environment root, across a
          #              module boundary Checkov does not follow.

      # Not continue-on-error: unlike tflint/checkov above (deliberately
      # advisory — see docs/design-decisions.md#non-blocking-security-scanners),
      # a config that doesn't even validate/plan should fail the build.
      - name: Validate each environment
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
          # Placeholders so plan can evaluate templatefile() and the other
          # functions validate does not reach.
          TF_VAR_api_image: "placeholder"
          TF_VAR_worker_image: "placeholder"
          TF_VAR_git_commit: "ci-validate"
          # Required by staging/prod. dev does not declare it, and an unused
          # TF_VAR is ignored rather than an error (unlike -var).
          TF_VAR_monitoring_allowed_cidr: "[]"
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for env in dev staging prod; do
            echo "Validating $env..."
            cd terraform/environments/$env
            terraform init -backend=false -input=false
            terraform validate
            # Catches templatefile() and function errors validate misses;
            # -backend=false means no AWS calls.
            # grep's own "no matching line" exit (1) must not be mistaken for a
            # plan failure — check terraform plan's real exit code via
            # PIPESTATUS[0], not the piped compound's, which is grep's/`true`'s.
            terraform plan -refresh=false -input=false \
              -var-file=terraform.tfvars \
              -var="aws_region=us-east-1" \
              -var="tf_state_bucket=nexusdeploy-terraform-state" \
              -var="app_s3_bucket=nexusdeploy-attachments-${env}" \
              -var="db_name=nexusdeploy" \
              2>&1 | grep -E "^Error:|^Warning:|Plan:|will be created|will be destroyed" || true
            PLAN_EXIT=${PIPESTATUS[0]}
            if [[ "$PLAN_EXIT" != "0" ]]; then
              echo "::error::terraform plan failed for $env (exit $PLAN_EXIT)"
              exit 1
            fi
            cd ../../..
          done

  # Required status check for the main ruleset. Gates on the jobs that ran
  # (skipped counts as passed) and dispatches deploy.yml on success.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, terraform-lint, workflow-lint, secrets-scan]
    # !cancelled() rather than always(): a run cancelled by cancel-in-progress
    # must not count its cancelled jobs as passed and deploy a stale commit.
    if: ${{ !cancelled() }}
    # actions: write lets this job dispatch deploy.yml; scoped to this job only.
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check all jobs passed
        run: |
          # A job result of 'skipped' means it wasn't needed — treat as pass
          INFRA_CHANGED="${{ needs.detect-changes.outputs.infra_changed }}"

          FAILED=false

          # Check infra jobs only if infra changed
          if [[ "$INFRA_CHANGED" == "true" ]]; then
            if [[ "${{ needs.terraform-lint.result }}" == "failure" ]]; then
              echo "❌ Terraform CI failed — deploy will not run"
              FAILED=true
            fi
          fi

          # workflow-lint and secrets-scan have no path gating — always check them.
          if [[ "${{ needs.workflow-lint.result }}" == "failure" ]]; then
            echo "❌ Workflow quoting safety check failed — deploy will not run"
            FAILED=true
          fi

          if [[ "${{ needs.secrets-scan.result }}" == "failure" ]]; then
            echo "❌ Secret scan found a leaked credential — deploy will not run"
            FAILED=true
          fi

          if [[ "$FAILED" == "true" ]]; then
            exit 1
          fi

          echo "✅ All required CI checks passed"
          echo "   Infra jobs: ${{ needs.terraform-lint.result }}"
          echo "   Workflow quoting check: ${{ needs.workflow-lint.result }}"
          echo "   Secret scan: ${{ needs.secrets-scan.result }}"

      - name: Trigger deploy pipeline
        # Dependency bumps run CI but never deploy. The guard covers all three
        # Dependabot merge styles: squash ("chore(deps" matches both the deps
        # and deps-dev groups), merge commit ("...from <org>/dependabot/..."),
        # and direct pushes. [skip deploy] in the head commit also skips.
        # A manual run deploys only when the 'deploy' input is checked.
        # See docs/design-decisions.md#deploy-dispatch-guard
        if: |
          (github.ref_name == 'dev' || github.ref_name == 'staging' || github.ref_name == 'main') &&
          (
            (github.event_name == 'push' &&
             github.actor != 'dependabot[bot]' &&
             !startsWith(github.event.head_commit.message, 'chore(deps') &&
             !contains(github.event.head_commit.message, 'dependabot/') &&
             !contains(github.event.head_commit.message, '[skip deploy]'))
            ||
            (github.event_name == 'workflow_dispatch' && inputs.deploy)
          )
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const envMap = { main: 'prod', staging: 'staging', dev: 'dev' };
            const environment = envMap[branch] || 'dev';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: context.ref,
              inputs: {
                environment,
                action: 'apply',
                // Empty on a plain push (github.event.inputs doesn't exist for
                // that event) — deploy.yml's own default then applies.
                drain_minutes: '${{ github.event.inputs.drain_minutes }}'
              }
            });
            console.log(`🚀 Deploy triggered for ${branch} → ${environment}`);

      - name: Deploy dispatch skipped (dependency bump, [skip deploy], or manual run)
        if: |
          (github.ref_name == 'dev' || github.ref_name == 'staging' || github.ref_name == 'main') &&
          (
            (github.event_name == 'push' &&
             (github.actor == 'dependabot[bot]' ||
              startsWith(github.event.head_commit.message, 'chore(deps') ||
              contains(github.event.head_commit.message, 'dependabot/') ||
              contains(github.event.head_commit.message, '[skip deploy]')))
            ||
            (github.event_name == 'workflow_dispatch' && !inputs.deploy)
          )
        run: |
          echo "⏭️  CI passed but deploy was NOT dispatched — dependency bump, [skip deploy] marker, or a manual run with deploy unchecked." | tee -a $GITHUB_STEP_SUMMARY
          # A re-run replays the original run's inputs, so 'deploy' stays false
          # however the box is ticked; only a fresh dispatch changes it.
          echo "Start a NEW manual run with the 'deploy' box checked (re-running this one keeps deploy=false), or run deploy.yml manually (Actions → Deploy → Run workflow), to ship this change." | tee -a $GITHUB_STEP_SUMMARY
