name: CI - Test & Build

on:
  push:
    branches: [main, dev, staging, "feature/**"]
  pull_request:
    branches: [main, dev, staging]
  workflow_dispatch: # allow manual trigger
    inputs:
      deploy:
        description: "Also dispatch a deploy after CI passes (manual runs only; off = CI without deploy)"
        type: boolean
        default: false

# One run per ref; a newer push cancels the in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: us-east-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Read-only by default; jobs needing more declare it themselves:
#   lint / terraform-lint : contents: write        (push auto-format commits)
#   docker-build          : security-events: write (upload the Grype SARIF)
#   ci-summary            : actions: write         (dispatch deploy.yml)
# See docs/design-decisions.md#least-privilege-workflow-permissions
permissions:
  contents: read

jobs:
  # Gates the other jobs: app changes drive lint/test/docker-build,
  # infra changes drive terraform-lint.
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_changed: ${{ steps.filter.outputs.app }}
      infra_changed: ${{ steps.filter.outputs.infra }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the diff range below can reach many commits back.
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          # Manual dispatch runs every check; path filters apply to push and
          # pull_request only.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "app=true"   >> $GITHUB_OUTPUT
            echo "infra=true" >> $GITHUB_OUTPUT
            echo "🖐️ Manual dispatch — running all checks regardless of changed paths"
            exit 0
          fi

          # Diff the whole trigger range, not just the last commit:
          #   push         → event.before..HEAD, every commit in the push
          #   new branch   → event.before is all zeros, so use HEAD~1
          #   pull_request → HEAD is the merge commit, so HEAD~1 is the base tip
          # On diff failure, treat everything as changed and run more jobs.
          BASE="HEAD~1"
          if [[ "${{ github.event_name }}" == "push" && \
                "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE="${{ github.event.before }}"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || printf 'app/\nterraform/\n')

          if echo "$CHANGED" | grep -q "^app/"; then
            echo "app=true"  >> $GITHUB_OUTPUT
            echo "📦 App code changed"
          else
            echo "app=false" >> $GITHUB_OUTPUT
            echo "⏭️  No app changes"
          fi

          if echo "$CHANGED" | grep -qE "^terraform/|^\.github/"; then
            echo "infra=true"  >> $GITHUB_OUTPUT
            echo "🏗️  Infra/workflow changed"
          else
            echo "infra=false" >> $GITHUB_OUTPUT
            echo "⏭️  No infra changes"
          fi

  # Auto-formats with black/isort and commits the result, then runs flake8,
  # bandit and pip-audit.
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'

    permissions:
      contents: write # needed to push auto-format commits

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint dependencies
        run: pip install flake8 black isort bandit pip-audit

      - name: Auto-format with black and isort
        run: |
          cd app
          black .
          isort .

      - name: Commit formatting changes (if any)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          if ! git diff --quiet; then
            git add -A
            git commit -m "style: apply black and isort formatting [skip ci]"
            git push
            echo "✅ Formatting fixes committed and pushed"
          else
            echo "✅ No formatting changes needed"
          fi

      - name: Run flake8
        run: flake8 app/ --max-line-length=120 --exclude=migrations/

      - name: Run bandit (security scan)
        run: bandit -r app/src/ -ll -x app/src/tests/
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability scan)
        # Reads requirements.txt directly. Non-blocking.
        # See docs/design-decisions.md#non-blocking-security-scanners
        run: pip-audit --requirement app/requirements.txt --desc
        continue-on-error: true

  # Runs against live postgres and redis service containers.
  # Parallel with docker-build; both need lint to pass first.
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, lint]
    # Only run when app code changed AND lint passed
    if: |
      !cancelled() &&
      needs.detect-changes.outputs.app_changed == 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nexusdeploy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexusdeploy_test
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret-key-minimum-32-bytes!!
          ENV: testing
        run: |
          cd app
          pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        # Requires the CODECOV_TOKEN repo secret; best-effort so a missing
        # token never fails the run.
        continue-on-error: true
        with:
          files: app/coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Builds and scans both images. Parallel with test.
  docker-build:
    name: Docker Build & Security Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-changes, lint]
    # Parallel with test — only needs lint to pass, not test
    if: |
      !cancelled() &&
      needs.detect-changes.outputs.app_changed == 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')

    # api and worker have separate Dockerfiles and package sets, so each needs
    # its own scan. fail-fast: false lets one image still report when the
    # other's build fails.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: ./app/Dockerfile
          - image: worker
            dockerfile: ./app/Dockerfile.worker

    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./app
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: nexusdeploy-${{ matrix.image }}:${{ github.sha }}
          # Per-image cache scope; a shared key lets the two builds overwrite
          # each other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        id: grype
        with:
          image: nexusdeploy-${{ matrix.image }}:${{ github.sha }}
          fail-build: false
          severity-cutoff: critical
          output-format: sarif

      - name: Display Grype scan summary
        if: ${{ !cancelled() }}
        run: |
          echo "::group::Grype Scan Results (${{ matrix.image }})"
          cat ${{ steps.grype.outputs.sarif }} \
            | jq '.runs[].results[] | {ruleId, message: .message.text}' \
            2>/dev/null || echo "No vulnerabilities found or sarif parse error"
          echo "::endgroup::"
        continue-on-error: true

      - name: Upload Grype results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        # Skip when the scan produced no SARIF (e.g. the build failed).
        # !cancelled() rather than always() so a superseded run stops here.
        if: ${{ !cancelled() && steps.grype.outputs.sarif != '' }}
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          # Code scanning keys results on (category, ref), so each image needs
          # its own category or the second upload replaces the first.
          # Changing these strings resets the alert history:
          # see docs/design-decisions.md#grype-sarif-categories
          category: grype-${{ matrix.image }}
        continue-on-error: true

  # Formats, lints and validates the terraform tree. Parallel with the app jobs.
  terraform-lint:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    # Only run when terraform or workflow files changed
    if: needs.detect-changes.outputs.infra_changed == 'true'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.7.0

      - name: Auto-format Terraform files
        run: terraform fmt -recursive terraform/

      - name: Commit Terraform formatting changes (if any)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          if ! git diff --quiet; then
            git add -A
            git commit -m "style: apply terraform fmt formatting [skip ci]"
            git push
            echo "✅ Terraform formatting fixes committed and pushed"
          else
            echo "✅ No Terraform formatting changes needed"
          fi

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6

      - name: Run TFLint
        run: |
          cd terraform
          tflint --init
          tflint --recursive
        continue-on-error: true

      # Static security scanner for IaC. Non-blocking.
      # See docs/design-decisions.md#non-blocking-security-scanners
      - name: Run Checkov (IaC security scan)
        continue-on-error: true
        run: |
          pip install --quiet checkov
          checkov \
            --directory terraform/ \
            --quiet \
            --compact \
            --soft-fail \
            --output cli \
            --skip-check CKV_AWS_79,CKV2_AWS_5
          # CKV_AWS_79   IMDSv1 — the monitoring user_data already uses IMDSv2.
          # CKV2_AWS_5   "SG is unattached" — false positive; the SGs are wired
          #              in via variables from the environment root, across a
          #              module boundary Checkov does not follow.

      - name: Validate each environment
        continue-on-error: true
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
          # Placeholders so plan can evaluate templatefile() and the other
          # functions validate does not reach.
          TF_VAR_api_image: "placeholder"
          TF_VAR_worker_image: "placeholder"
          TF_VAR_git_commit: "ci-validate"
          # Required by staging/prod. dev does not declare it, and an unused
          # TF_VAR is ignored rather than an error (unlike -var).
          TF_VAR_monitoring_allowed_cidr: "[]"
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for env in dev staging prod; do
            echo "Validating $env..."
            cd terraform/environments/$env
            terraform init -backend=false -input=false
            terraform validate
            # Catches templatefile() and function errors validate misses;
            # -backend=false means no AWS calls.
            terraform plan -refresh=false -input=false \
              -var-file=terraform.tfvars \
              -var="aws_region=us-east-1" \
              -var="tf_state_bucket=nexusdeploy-terraform-state" \
              -var="app_s3_bucket=nexusdeploy-attachments-${env}" \
              -var="db_name=nexusdeploy" \
              2>&1 | grep -E "^Error:|^Warning:|Plan:|will be created|will be destroyed" || true
            cd ../../..
          done

  # Required status check for the main ruleset. Gates on the jobs that ran
  # (skipped counts as passed) and dispatches deploy.yml on success.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, lint, test, docker-build, terraform-lint]
    # !cancelled() rather than always(): a run cancelled by cancel-in-progress
    # must not count its cancelled jobs as passed and deploy a stale commit.
    if: ${{ !cancelled() }}
    # actions: write lets this job dispatch deploy.yml; scoped to this job only.
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check all jobs passed
        run: |
          # A job result of 'skipped' means it wasn't needed — treat as pass
          APP_CHANGED="${{ needs.detect-changes.outputs.app_changed }}"
          INFRA_CHANGED="${{ needs.detect-changes.outputs.infra_changed }}"

          FAILED=false

          # Check app jobs only if app changed
          if [[ "$APP_CHANGED" == "true" ]]; then
            if [[ "${{ needs.lint.result }}"         == "failure" ]] || \
               [[ "${{ needs.test.result }}"         == "failure" ]] || \
               [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
              echo "❌ App CI failed — deploy will not run"
              FAILED=true
            fi
          fi

          # Check infra jobs only if infra changed
          if [[ "$INFRA_CHANGED" == "true" ]]; then
            if [[ "${{ needs.terraform-lint.result }}" == "failure" ]]; then
              echo "❌ Terraform CI failed — deploy will not run"
              FAILED=true
            fi
          fi

          if [[ "$FAILED" == "true" ]]; then
            exit 1
          fi

          echo "✅ All required CI checks passed"
          echo "   App jobs:   ${{ needs.lint.result }} / ${{ needs.test.result }} / ${{ needs.docker-build.result }}"
          echo "   Infra jobs: ${{ needs.terraform-lint.result }}"

      - name: Trigger deploy pipeline
        # Dependency bumps run CI but never deploy. The guard covers all three
        # Dependabot merge styles: squash ("chore(deps" matches both the deps
        # and deps-dev groups), merge commit ("...from <org>/dependabot/..."),
        # and direct pushes. [skip deploy] in the head commit also skips.
        # A manual run deploys only when the 'deploy' input is checked.
        # See docs/design-decisions.md#deploy-dispatch-guard
        if: |
          (github.ref_name == 'dev' || github.ref_name == 'staging' || github.ref_name == 'main') &&
          (
            (github.event_name == 'push' &&
             github.actor != 'dependabot[bot]' &&
             !startsWith(github.event.head_commit.message, 'chore(deps') &&
             !contains(github.event.head_commit.message, 'dependabot/') &&
             !contains(github.event.head_commit.message, '[skip deploy]'))
            ||
            (github.event_name == 'workflow_dispatch' && inputs.deploy)
          )
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const envMap = { main: 'prod', staging: 'staging', dev: 'dev' };
            const environment = envMap[branch] || 'dev';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: context.ref,
              inputs: {
                environment,
                action: 'apply',
                app_changed: '${{ needs.detect-changes.outputs.app_changed }}'
              }
            });
            console.log(`🚀 Deploy triggered for ${branch} → ${environment}`);

      - name: Deploy dispatch skipped (dependency bump, [skip deploy], or manual run)
        if: |
          (github.ref_name == 'dev' || github.ref_name == 'staging' || github.ref_name == 'main') &&
          (
            (github.event_name == 'push' &&
             (github.actor == 'dependabot[bot]' ||
              startsWith(github.event.head_commit.message, 'chore(deps') ||
              contains(github.event.head_commit.message, 'dependabot/') ||
              contains(github.event.head_commit.message, '[skip deploy]')))
            ||
            (github.event_name == 'workflow_dispatch' && !inputs.deploy)
          )
        run: |
          echo "⏭️  CI passed but deploy was NOT dispatched — dependency bump, [skip deploy] marker, or a manual run with deploy unchecked." | tee -a $GITHUB_STEP_SUMMARY
          # A re-run replays the original run's inputs, so 'deploy' stays false
          # however the box is ticked; only a fresh dispatch changes it.
          echo "Start a NEW manual run with the 'deploy' box checked (re-running this one keeps deploy=false), or run deploy.yml manually (Actions → Deploy → Run workflow), to ship this change." | tee -a $GITHUB_STEP_SUMMARY
