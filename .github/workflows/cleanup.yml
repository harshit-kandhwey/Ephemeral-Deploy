name: Cleanup - Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to target"
        required: true
        type: choice
        # prod is destroyable here, but its destroy job runs under the `prod`
        # GitHub environment and blocks on manual approval.
        # See docs/design-decisions.md#prod-teardown-is-gated-not-forbidden
        options: [dev, staging, prod]
      action:
        description: "Action to perform"
        required: false
        default: "destroy"
        type: choice
        options: [destroy, drain_old_slot]
      old_slot:
        description: "Old blue-green slot to drain (slot1 or slot2) — drain_old_slot only"
        required: false
        default: ""
      expected_active_slot:
        description: "Generation guard: slot that must STILL be active for the drain to proceed — drain_old_slot only"
        required: false
        default: ""
      expected_generation:
        description: "Generation guard: deployment generation that must STILL be current — drain_old_slot only"
        required: false
        default: ""
      terraform_ref:
        description: "Immutable commit SHA the reclaim apply must use — drain_old_slot only"
        required: false
        default: ""
      delay_minutes:
        description: "Delay before action (minutes)"
        required: false
        default: "0"
      reason:
        description: "Reason for cleanup"
        required: false
        default: "Manual cleanup"

  # Nightly safety net — destroys any forgotten dev environments
  schedule:
    - cron: "0 0 * * *" # Midnight UTC

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.0
  TF_STATE_BUCKET: nexusdeploy-terraform-state
  TF_LOCK_TABLE: nexusdeploy-terraform-locks
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  destroy:
    name: Destroy ${{ matrix.environment }}
    # Sleeps up to delay_minutes (30 on the dev TTL path) before destroying,
    # so the cap must cover the sleep plus the destroy.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    # Scheduled runs sweep dev AND staging (nightly safety net for anything
    # left running — never prod, that stays manual-only). Manual runs still
    # target exactly the one environment chosen, and skip destroy entirely
    # for drain_old_slot.
    if: github.event_name == 'schedule' || github.event.inputs.action != 'drain_old_slot'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'schedule' && fromJson('["dev","staging"]') || fromJson(format('["{0}"]', github.event.inputs.environment || 'dev')) }}
    environment: ${{ matrix.environment }}

    permissions:
      id-token: write
      contents: read

    env:
      TF_ENV: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Sleep before acquiring credentials: the OIDC token is requested by
      # configure-aws-credentials below, so this does not consume its TTL.
      - name: Wait for TTL delay
        if: github.event.inputs.delay_minutes != '0' && github.event.inputs.delay_minutes != ''
        run: |
          DELAY='${{ github.event.inputs.delay_minutes || 0 }}'
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid delay_minutes: must be a non-negative integer, got: $DELAY"
            exit 1
          fi
          # Capped at the documented 30-minute dev TTL: the job must still run
          # destroy, fallback cleanup and state backup inside its 90-minute
          # timeout, so a larger manual value would cancel it mid-run.
          if (( DELAY > 30 )); then
            echo "❌ Invalid delay_minutes: exceeds the maximum destroy delay (30)"
            exit 1
          fi
          echo "⏳ Waiting ${DELAY} minutes before cleanup..."
          echo "Reason: ${{ github.event.inputs.reason }}"
          sleep $((DELAY * 60))

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: Cleanup-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_ENV }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      # Prod sets deletion_protection = true and Terraform will not clear it —
      # it just fails the destroy. No-op for dev/staging, which set it false;
      # a missing instance reports ABSENT rather than failing the job.
      # See docs/design-decisions.md#rds-deletion-protection-is-cleared-before-destroy
      - name: Clear RDS deletion protection
        env:
          DB_IDENTIFIER: nexusdeploy-${{ env.TF_ENV }}-postgres
        run: |
          PROTECTED=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_IDENTIFIER" \
            --region "${{ env.AWS_REGION }}" \
            --query 'DBInstances[0].DeletionProtection' \
            --output text 2>/dev/null || echo "ABSENT")

          case "$PROTECTED" in
            True)
              echo "🔓 Deletion protection enabled on $DB_IDENTIFIER — clearing it before destroy"
              aws rds modify-db-instance \
                --db-instance-identifier "$DB_IDENTIFIER" \
                --no-deletion-protection \
                --apply-immediately \
                --region "${{ env.AWS_REGION }}" \
                --no-cli-pager > /dev/null
              echo "✅ Deletion protection cleared"
              ;;
            ABSENT)
              echo "ℹ️  No RDS instance named $DB_IDENTIFIER — nothing to clear"
              ;;
            *)
              echo "ℹ️  Deletion protection already off for $DB_IDENTIFIER"
              ;;
          esac

      # ── Step 1: Graceful Terraform destroy ──────────────────────────────
      - name: Terraform Destroy
        id: tf_destroy
        working-directory: terraform/environments/${{ env.TF_ENV }}
        env:
          TF_VAR_api_image: "placeholder"
          TF_VAR_worker_image: "placeholder"
          TF_VAR_git_commit: "cleanup"
          # Required by staging/prod (no default in variables.tf); unused for destroy
          TF_VAR_monitoring_allowed_cidr: "[]"
        run: |
          echo "🔥 Starting Terraform destroy for ${{ env.TF_ENV }}..."

          # dev has a single module.ecs; staging/prod use the blue-green split.
          # The deployment/* SSM parameters are workflow-owned, not Terraform
          # resources, so a dedicated step below deletes them.
          if [[ "${{ env.TF_ENV }}" == "staging" || "${{ env.TF_ENV }}" == "prod" ]]; then
            ECS_TARGETS="-target=module.ecs_slot1 -target=module.ecs_slot2"
          else
            ECS_TARGETS="-target=module.ecs"
          fi

          terraform destroy \
            -input=false \
            -var-file="terraform.tfvars" \
            -auto-approve \
            -no-color \
            $ECS_TARGETS \
            -target=module.rds \
            -target=module.elasticache \
            -target=module.vpc \
            -target=module.security_groups \
            -target=module.monitoring \
            -target=module.iam.aws_iam_role.ecs_execution \
            -target=module.iam.aws_iam_role.ecs_execution_worker \
            -target=module.iam.aws_iam_role.ecs_task \
            -target=module.iam.aws_iam_role.vpc_flow_log \
            -target=module.iam.aws_iam_role_policy.ecs_execution_secrets \
            -target=module.iam.aws_iam_role_policy.ecs_execution_worker_secrets \
            -target=module.iam.aws_iam_role_policy.ecs_task_s3 \
            -target=module.iam.aws_iam_role_policy.vpc_flow_log \
            -target=module.iam.aws_iam_role_policy_attachment.ecs_execution_managed \
            -target=aws_secretsmanager_secret.app \
            -target=aws_secretsmanager_secret_version.app \
            -target=aws_secretsmanager_secret.init \
            -target=aws_secretsmanager_secret_version.init \
            -target=aws_secretsmanager_secret.seed \
            -target=aws_secretsmanager_secret_version.seed \
            2>&1 | tee destroy_output.txt
          echo "tf_destroy_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          # module.iam (OIDC + deploy role) and module.ecr are excluded: they are
          # bootstrap-owned and must survive cleanup.
          # See docs/design-decisions.md#bootstrap-owned-resources-survive-cleanup
        continue-on-error: true # fallback script runs if this fails

      # ── Step 2: Fallback — tag-based nuke script ─────────────────────────
      - name: Fallback cleanup script (if Terraform failed)
        id: fallback_cleanup
        if: steps.tf_destroy.outputs.tf_destroy_exit != '0'
        run: |
          echo "⚠️ Terraform destroy failed — running tag-based cleanup script..."
          chmod +x scripts/cleanup.sh
          ./scripts/cleanup.sh \
            --env ${{ env.TF_ENV }} \
            --region ${{ env.AWS_REGION }} \
            --force

      # ── Step 2.5: Delete workflow-owned deployment SSM parameters ────────
      # Written by deploy-blue-green.yml, so terraform destroy never removes
      # them; left behind they misdirect the next deploy. Only staging/prod run
      # blue-green. Gated on a teardown having succeeded — see
      # docs/design-decisions.md#deployment-ssm-parameters-are-workflow-owned
      - name: Delete deployment SSM parameters
        if: >-
          always() &&
          (env.TF_ENV == 'staging' || env.TF_ENV == 'prod') &&
          (steps.tf_destroy.outputs.tf_destroy_exit == '0' ||
           steps.fallback_cleanup.outcome == 'success')
        run: |
          for name in active_slot generation prev_api_image prev_worker_image; do
            PARAM="/nexusdeploy/${{ env.TF_ENV }}/deployment/${name}"
            if aws ssm delete-parameter \
                --name "$PARAM" \
                --region "${{ env.AWS_REGION }}" 2>/dev/null; then
              echo "🗑️  Deleted $PARAM"
            else
              echo "ℹ️  $PARAM not present — nothing to delete"
            fi
          done

      # ECR images are left to each repo's lifecycle policy: keep the last 3
      # tagged images, expire untagged ones after a day.
      # See docs/design-decisions.md#ecr-images-are-left-to-the-lifecycle-policy

      # ── Step 3: Clean monitoring configs from S3 ────────────────────────
      # Configs are env-scoped under monitoring/config/<env>/, so cleaning one
      # environment never removes another's. The bucket itself is never deleted:
      # it is bootstrap infrastructure and holds all Terraform state.
      - name: Clean monitoring config objects from S3
        run: |
          echo "🧹 Cleaning monitoring config objects for ${{ env.TF_ENV }} from S3..."
          aws s3 rm             "s3://${{ env.TF_STATE_BUCKET }}/monitoring/config/${{ env.TF_ENV }}/"             --recursive             --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          echo "✅ Monitoring configs cleaned for ${{ env.TF_ENV }} (bucket + other envs preserved)"

      # ── Step 4: Delete Terraform state from S3 ───────────────────────────
      - name: Delete Terraform state from S3
        run: |
          STATE_KEY="${{ env.TF_ENV }}/terraform.tfstate"

          if aws s3api head-object \
              --bucket "${{ env.TF_STATE_BUCKET }}" \
              --key "$STATE_KEY" \
              --region "${{ env.AWS_REGION }}" 2>/dev/null; then

            # Back up first; abort the deletion if the backup fails.
            if ! aws s3 cp \
              "s3://${{ env.TF_STATE_BUCKET }}/$STATE_KEY" \
              "s3://${{ env.TF_STATE_BUCKET }}/backups/${{ env.TF_ENV }}/terraform-$(date +%Y%m%d-%H%M%S).tfstate" \
              --region "${{ env.AWS_REGION }}"; then
              echo "❌ Failed to backup state file — aborting deletion to prevent data loss"
              exit 1
            fi

            aws s3 rm \
              "s3://${{ env.TF_STATE_BUCKET }}/$STATE_KEY" \
              --region "${{ env.AWS_REGION }}"

            echo "✅ State deleted and backed up"
          else
            echo "ℹ️ No state file found for ${{ env.TF_ENV }}"
          fi

          # The state-checksum row outlives the deleted state and makes the next
          # `terraform init` fail on a checksum mismatch.
          # See docs/design-decisions.md#state-deletion-also-clears-the-dynamodb-rows
          DIGEST_ID="${{ env.TF_STATE_BUCKET }}/$STATE_KEY-md5"
          aws dynamodb delete-item \
            --table-name "${{ env.TF_LOCK_TABLE }}" \
            --key "{\"LockID\":{\"S\":\"$DIGEST_ID\"}}" \
            --region "${{ env.AWS_REGION }}" 2>/dev/null \
          && echo "✅ Stale state digest removed from ${{ env.TF_LOCK_TABLE }}" \
          || echo "ℹ️ No state digest to remove"

          # A killed or timed-out destroy leaves the lock mutex held, blocking
          # the next init with "Error acquiring the state lock". It is orphaned
          # once the environment is gone.
          LOCK_ID="${{ env.TF_STATE_BUCKET }}/$STATE_KEY"
          aws dynamodb delete-item \
            --table-name "${{ env.TF_LOCK_TABLE }}" \
            --key "{\"LockID\":{\"S\":\"$LOCK_ID\"}}" \
            --region "${{ env.AWS_REGION }}" 2>/dev/null \
          && echo "✅ Stale state lock removed from ${{ env.TF_LOCK_TABLE }}" \
          || echo "ℹ️ No state lock to remove"

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Cleanup summary
        if: always()
        run: |
          echo "## 🧹 Cleanup Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ env.TF_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ github.event.inputs.reason || 'Scheduled nightly cleanup' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Destroy | ${{ steps.tf_destroy.outputs.tf_destroy_exit == '0' && '✅ Success' || '⚠️ Used fallback script' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ECR Images | ✅ Managed by lifecycle policy |" >> $GITHUB_STEP_SUMMARY
          echo "| S3 Bucket | ✅ Preserved (bootstrap resource) |" >> $GITHUB_STEP_SUMMARY
          echo "| State File | 🗑️ Deleted (backed up) |" >> $GITHUB_STEP_SUMMARY

  # Blue-green drain, scheduled by deploy-blue-green.yml after a promotion.
  # Scales the old slot's ECS services to 0; does not destroy infrastructure.
  #
  # Split into three jobs (wait → approve → reclaim) so the multi-hour sleep
  # holds neither the concurrency group nor a pending prod approval.
  # See docs/design-decisions.md#the-drain-is-three-jobs-not-one
  drain-wait:
    name: Drain delay (${{ github.event.inputs.old_slot }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'drain_old_slot'
    # Sleep chunk (max 300 min) must finish inside GitHub's 360-min job limit
    timeout-minutes: 350

    permissions:
      contents: read
      actions: write # needed to re-dispatch itself when delay > 300 min

    outputs:
      drain_now: ${{ steps.wait.outputs.drain_now }}

    steps:
      # GitHub kills hosted jobs at 360 min, so prod's 24h delay cannot sleep in
      # one job. Sleep at most 300 min, then re-dispatch with the remainder.
      - name: Wait for delay
        id: wait
        if: github.event.inputs.delay_minutes != '0' && github.event.inputs.delay_minutes != ''
        run: |
          DELAY='${{ github.event.inputs.delay_minutes || 0 }}'
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid delay_minutes: must be a non-negative integer, got: $DELAY"
            exit 1
          fi
          MAX_CHUNK=300
          if (( DELAY > MAX_CHUNK )); then
            echo "⏳ Delay ${DELAY} min exceeds job limit — sleeping ${MAX_CHUNK} min, then re-dispatching for the remaining $((DELAY - MAX_CHUNK)) min"
            echo "Reason: ${{ github.event.inputs.reason }}"
            sleep $((MAX_CHUNK * 60))
            echo "remaining=$((DELAY - MAX_CHUNK))" >> $GITHUB_OUTPUT
            echo "drain_now=false" >> $GITHUB_OUTPUT
          else
            echo "⏳ Waiting ${DELAY} minutes before draining old slot..."
            echo "Reason: ${{ github.event.inputs.reason }}"
            sleep $((DELAY * 60))
            echo "drain_now=true" >> $GITHUB_OUTPUT
          fi

      - name: Re-dispatch drain with remaining delay
        if: steps.wait.outputs.drain_now == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cleanup.yml',
              ref: context.ref,
              inputs: {
                environment: '${{ github.event.inputs.environment }}',
                action: 'drain_old_slot',
                old_slot: '${{ github.event.inputs.old_slot }}',
                expected_active_slot: '${{ github.event.inputs.expected_active_slot }}',
                expected_generation: '${{ github.event.inputs.expected_generation }}',
                terraform_ref: '${{ github.event.inputs.terraform_ref }}',
                delay_minutes: '${{ steps.wait.outputs.remaining }}',
                reason: '${{ github.event.inputs.reason }}'
              }
            });
            console.log('🔁 Drain re-dispatched with ${{ steps.wait.outputs.remaining }} min remaining');

  # Carries `environment:` — and so prod's required reviewer — on a job that is
  # deliberately outside the blue-green concurrency group, because a job pending
  # approval holds its group.
  # See docs/design-decisions.md#the-drain-is-three-jobs-not-one
  drain-approve:
    name: Approve drain (${{ github.event.inputs.environment }})
    needs: drain-wait
    if: needs.drain-wait.outputs.drain_now != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event.inputs.environment }}

    permissions:
      contents: read

    # drain-reclaim has no `environment:`, so environment-scoped `vars` do not
    # resolve there. Both values carried here are non-secret configuration.
    outputs:
      monitoring_allowed_cidr: ${{ steps.envvars.outputs.monitoring_allowed_cidr }}
      alert_email: ${{ steps.envvars.outputs.alert_email }}

    steps:
      - name: Carry environment configuration to the reclaim job
        id: envvars
        # Must go through env:, not a raw GH expression inside the echo string:
        # GitHub interpolates an expression like vars.X as literal text before
        # bash ever parses the line, so a value containing its own quotes
        # (MONITORING_ALLOWED_CIDR is a JSON array, e.g. ["1.2.3.0/24"])
        # collides with the echo argument's own quoting and bash silently
        # eats the inner quotes — corrupting it to
        # [1.2.3.0/24], which is not valid JSON. $VAR expansion inside a
        # double-quoted bash string does not have this problem.
        env:
          MONITORING_ALLOWED_CIDR: ${{ vars.MONITORING_ALLOWED_CIDR }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          echo "monitoring_allowed_cidr=$MONITORING_ALLOWED_CIDR" >> $GITHUB_OUTPUT
          echo "alert_email=$ALERT_EMAIL" >> $GITHUB_OUTPUT
          echo "✅ Drain approved for ${{ github.event.inputs.environment }} — handing off to the reclaim job."

  drain-reclaim:
    name: Reclaim old slot (${{ github.event.inputs.old_slot }})
    needs: [drain-wait, drain-approve]
    # drain_now is empty when the wait step was skipped (delay_minutes == 0),
    # which means "drain immediately" — so test for the explicit 'false'.
    if: needs.drain-wait.outputs.drain_now != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `environment:` here: drain-approve already gated this, and re-declaring
    # it would put an approval wait back inside the concurrency group.

    # Shared with deploy-blue-green.yml's deploy job so the guard-then-apply
    # pair cannot interleave with a deploy that promotes a slot.
    concurrency:
      group: blue-green-${{ github.event.inputs.environment }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    env:
      TF_ENV: ${{ github.event.inputs.environment }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: DrainSlot-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generation guard — is this drain still current?
        id: guard
        run: |
          OLD_SLOT="${{ github.event.inputs.old_slot }}"
          EXPECTED="${{ github.event.inputs.expected_active_slot }}"
          EXPECTED_GEN="${{ github.event.inputs.expected_generation }}"
          TF_REF="${{ github.event.inputs.terraform_ref }}"
          ENV="${{ env.TF_ENV }}"

          # Fail closed on the safety inputs. deploy-blue-green.yml supplies all
          # four automatically, so a dispatch missing any is hand-typed or from
          # an older workflow. There is no safe partial mode: refuse instead.
          MISSING=""
          [[ -z "$OLD_SLOT" ]]     && MISSING="$MISSING old_slot"
          [[ -z "$EXPECTED" ]]     && MISSING="$MISSING expected_active_slot"
          [[ -z "$EXPECTED_GEN" ]] && MISSING="$MISSING expected_generation"
          [[ -z "$TF_REF" ]]       && MISSING="$MISSING terraform_ref"
          if [[ -n "$MISSING" ]]; then
            echo "::error::Refusing to drain — missing required safety input(s):$MISSING. These are set automatically when deploy-blue-green.yml schedules a drain; supply all of them if dispatching by hand."
            exit 1
          fi

          # Slot names are interpolated into resource names and select the slot
          # Terraform scales down, so reject anything outside the known set.
          for pair in "old_slot:$OLD_SLOT" "expected_active_slot:$EXPECTED"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [[ "$val" != "slot1" && "$val" != "slot2" ]]; then
              echo "::error::$name must be slot1 or slot2, got: '$val'"
              exit 1
            fi
          done

          if [[ "$OLD_SLOT" == "$EXPECTED" ]]; then
            echo "::error::old_slot and expected_active_slot are both '$OLD_SLOT' — this drain would scale down the slot it expects to be live. Refusing."
            exit 1
          fi

          # Re-read the current state: this drain was scheduled hours ago, and
          # because slots alternate, a later deploy may have promoted the very
          # slot it was told to drain. Proceed only if nothing has moved.
          set +e
          ACTIVE=$(aws ssm get-parameter \
            --name "/nexusdeploy/${ENV}/deployment/active_slot" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Parameter.Value' --output text 2>&1)
          RC=$?
          set -e

          if [[ $RC -ne 0 ]]; then
            echo "::error::Could not read active_slot from SSM (exit $RC). Refusing to drain on an unknown active slot."
            echo "$ACTIVE"
            exit 1
          fi

          if [[ "$ACTIVE" == "$OLD_SLOT" ]]; then
            echo "::warning::ABORTING drain — $OLD_SLOT is the ACTIVE slot now. A later deploy promoted it after this drain was scheduled."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "$ACTIVE" != "$EXPECTED" ]]; then
            echo "::warning::ABORTING drain — expected active slot '$EXPECTED' but SSM says '$ACTIVE'. A newer deploy superseded this drain."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # The generation is the deploy-attempt epoch and never repeats, which
          # closes the ABA hole the slot comparison alone leaves open. It also
          # advances on failed deploys, whose Terraform revision is still applied.
          # See docs/design-decisions.md#the-drain-guard-closes-an-aba-hole
          set +e
          GEN=$(aws ssm get-parameter \
            --name "/nexusdeploy/${ENV}/deployment/generation" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Parameter.Value' --output text 2>&1)
          GEN_RC=$?
          set -e

          if [[ $GEN_RC -ne 0 ]]; then
            echo "::error::Could not read the deployment generation from SSM (exit $GEN_RC). Refusing to drain on an unverifiable generation."
            echo "$GEN"
            exit 1
          fi

          if [[ "$GEN" != "$EXPECTED_GEN" ]]; then
            echo "::warning::ABORTING drain — deployment generation is '$GEN', this drain was scheduled by generation '$EXPECTED_GEN'. A newer deploy (successful or failed) superseded it."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Guard passed: active=$ACTIVE, generation=${GEN:-n/a}, draining $OLD_SLOT."
          echo "active_slot=$ACTIVE" >> $GITHUB_OUTPUT
          echo "generation=$GEN" >> $GITHUB_OUTPUT
          echo "proceed=true" >> $GITHUB_OUTPUT

      # Pinned to the SHA the deploy ran, not the branch: this job fires hours
      # later, and a branch checkout would ship every unrelated infrastructure
      # commit merged since.
      - name: Checkout Terraform at the deployed revision
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.terraform_ref || github.sha }}

      - name: Setup Terraform
        if: steps.guard.outputs.proceed == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        if: steps.guard.outputs.proceed == 'true'
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_ENV }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Reclaim old slot capacity (terraform apply)
        id: reclaim
        if: steps.guard.outputs.proceed == 'true'
        working-directory: terraform/environments/${{ env.TF_ENV }}
        env:
          TF_VAR_deployment_slot: ${{ steps.guard.outputs.active_slot }}
          # Drops the overlap the deploy put in place, taking the inactive slot
          # to desired_count 0.
          TF_VAR_keep_previous_slot_running: "false"
          # The checked-out revision, not this run's SHA, so the tag reflects
          # the code being applied.
          TF_VAR_git_commit: ${{ github.event.inputs.terraform_ref || github.sha }}
          # Carried from drain-approve; this job has no `environment:`.
          TF_VAR_monitoring_allowed_cidr: ${{ needs.drain-approve.outputs.monitoring_allowed_cidr }}
          TF_VAR_alert_email: ${{ needs.drain-approve.outputs.alert_email }}
        run: |
          ENV="${{ env.TF_ENV }}"

          # Terraform is authoritative over desired_count, so capacity has to be
          # reclaimed by an apply. prev_*_image holds the ACTIVE slot's images,
          # so feeding them back keeps this a capacity-only change.
          # See docs/design-decisions.md#the-drain-reclaims-capacity-through-terraform
          API_IMAGE=$(aws ssm get-parameter \
            --name "/nexusdeploy/${ENV}/deployment/prev_api_image" \
            --query 'Parameter.Value' --output text \
            --region "${{ env.AWS_REGION }}" 2>/dev/null || echo "")
          WORKER_IMAGE=$(aws ssm get-parameter \
            --name "/nexusdeploy/${ENV}/deployment/prev_worker_image" \
            --query 'Parameter.Value' --output text \
            --region "${{ env.AWS_REGION }}" 2>/dev/null || echo "")

          # Empty and the literal "placeholder" are both disqualifying:
          # "placeholder" is the variables.tf default and an unpullable
          # reference, so an emptiness check alone would let it re-image the
          # live slot. Mirrors the guard in deploy-blue-green.yml's apply.
          for pair in "prev_api_image:$API_IMAGE" "prev_worker_image:$WORKER_IMAGE"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [[ -z "$val" || "$val" == "placeholder" ]]; then
              echo "::error::$name resolved to '${val:-<empty>}' — refusing to apply. This apply is meant to change capacity only, and an unresolved image would re-image the live slot ${{ steps.guard.outputs.active_slot }} with something unpullable."
              exit 1
            fi
          done

          export TF_VAR_api_image="$API_IMAGE"
          export TF_VAR_worker_image="$WORKER_IMAGE"
          export TF_VAR_previous_api_image="$API_IMAGE"
          export TF_VAR_previous_worker_image="$WORKER_IMAGE"

          if [[ -z "${TF_VAR_monitoring_allowed_cidr:-}" ]]; then
            echo "::error::MONITORING_ALLOWED_CIDR is not set for ${ENV}. Add it in GitHub → Settings → Environments → ${ENV} → Variables."
            exit 1
          fi
          if [[ "${TF_VAR_monitoring_allowed_cidr}" != \[* ]]; then
            export TF_VAR_monitoring_allowed_cidr='["'"${TF_VAR_monitoring_allowed_cidr}"'"]'
          fi

          echo "🔻 Reclaiming ${{ github.event.inputs.old_slot }} (active stays ${{ steps.guard.outputs.active_slot }})"
          terraform apply -input=false -var-file=terraform.tfvars -auto-approve
          echo "✅ Old slot ${{ github.event.inputs.old_slot }} drained to desired_count 0"

      - name: Drain summary
        if: always()
        run: |
          # `proceed` is empty both when the guard deliberately aborted and when
          # it errored, so check the step outcome first — otherwise a crashed
          # guard reports as a safe supersede.
          if [[ "${{ steps.guard.outcome }}" == "failure" ]]; then
            echo "## ❌ Blue-Green Drain FAILED (guard error)" >> $GITHUB_STEP_SUMMARY
            echo "The generation guard could not establish whether this drain is still current, so nothing was touched. \`${{ github.event.inputs.old_slot }}\` is still at capacity. Check the guard step's log — a missing safety input or an unreadable SSM parameter are the usual causes." >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ steps.guard.outputs.proceed }}" != "true" ]]; then
            echo "## 🛑 Blue-Green Drain Aborted (superseded)" >> $GITHUB_STEP_SUMMARY
            echo "The slot was left at capacity on purpose — a newer deploy owns the rotation." >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ steps.reclaim.outcome }}" == "success" ]]; then
            echo "## 🔻 Blue-Green Old Slot Drained" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Blue-Green Drain FAILED" >> $GITHUB_STEP_SUMMARY
            echo "The reclaim apply did not succeed — \`${{ github.event.inputs.old_slot }}\` is still at capacity and is still being billed. Re-run this drain once the cause is fixed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ env.TF_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target slot | \`${{ github.event.inputs.old_slot }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Expected active | \`${{ github.event.inputs.expected_active_slot }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actual active | \`${{ steps.guard.outputs.active_slot }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Expected generation | \`${{ github.event.inputs.expected_generation }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actual generation | \`${{ steps.guard.outputs.generation }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform revision | \`${{ github.event.inputs.terraform_ref || github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Reclaim result | \`${{ steps.reclaim.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ github.event.inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
